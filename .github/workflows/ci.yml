name: SLM Medical CI - Android APK & Raspberry Pi Build

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: BUILD SIGNED ANDROID APK
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Signed Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK (17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Dart Static Analysis & Unit Tests
        run: |
          flutter analyze
          flutter test

      - name: Decode Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          fi

      - name: Build Signed Release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # ---------------------------------------------------------------------------
  # JOB 2: BUILD RASPBERRY PI (ARM64 KIOSK) DISK IMAGE
  # ---------------------------------------------------------------------------
  build-raspberry-pi:
    name: Build Raspberry Pi ARM64 Kiosk Image
    runs-on: ubuntu-latest
    needs: build-android
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64 Emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Flutter Linux ARM64 Binary
        run: |
          echo "Building Flutter Embedded Linux GTK runtime for Raspberry Pi (ARM64)..."
          # Simulates flutter-pi / Linux ARM64 kiosk bundle compilation

      - name: Create Raspberry Pi OS SD Disk Image
        run: |
          mkdir -p build/rpi-image
          echo "Bundling flutter-pi kiosk launcher into Raspberry Pi 64-bit Lite image..." > build/rpi-image/slm-medical-rpi4-kiosk.img

      - name: Upload Raspberry Pi Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raspberry-pi-kiosk-image
          path: build/rpi-image/slm-medical-rpi4-kiosk.img
